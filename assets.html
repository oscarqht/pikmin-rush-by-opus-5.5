<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Bulborb Rush — Generated Asset Sheet</title>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    body { margin: 0; background: #2a3a1c; color: #fff6dc; font-family: 'Nunito', sans-serif; }
    header { padding: 18px 28px; background: linear-gradient(#9a6234, #6e4422); border-bottom: 4px solid #2e1a0c; display: flex; align-items: center; gap: 20px; }
    h1 { font-family: 'Lilita One', sans-serif; font-weight: normal; margin: 0; color: #ffe36a; -webkit-text-stroke: 1.5px #2e1a0c; }
    h2 { font-family: 'Lilita One', sans-serif; font-weight: normal; margin: 28px 28px 10px; color: #ffe36a; }
    .grid { display: flex; flex-wrap: wrap; gap: 12px; padding: 0 28px; }
    .cell { background: radial-gradient(#9ad35e, #6aa53f); border: 3px solid #2e1a0c; border-radius: 12px; padding: 8px; text-align: center; font-weight: 800; font-size: 12px; color: #2e1a0c; }
    .cell canvas { display: block; margin: 0 auto 4px; }
    button { font-family: 'Lilita One', sans-serif; font-size: 16px; padding: 8px 16px; border-radius: 10px; border: 3px solid #2e1a0c; background: #5aa53a; color: #fff; cursor: pointer; }
    .note { opacity: 0.85; font-weight: 700; }
  </style>
</head>
<body>
  <header>
    <h1>Bulborb Rush — Asset Sheet</h1>
    <span class="note">Every sprite below is generated procedurally by the game's JavaScript art modules.</span>
    <button id="dl">Download all as PNG</button>
  </header>
  <div id="root"></div>
  <script src="js/core.js"></script>
  <script src="js/art/art-core.js"></script>
  <script src="js/art/art-enemies.js"></script>
  <script src="js/art/art-creatures.js"></script>
  <script src="js/art/art-world.js"></script>
  <script src="js/data.js"></script>
  <script src="js/levels.js"></script>
  <script>
    const { Art, U } = PTD;
    Art.setRes(3);
    const root = document.getElementById('root');
    const all = [];
    function section(title) {
      const h = document.createElement('h2'); h.textContent = title; root.appendChild(h);
      const g = document.createElement('div'); g.className = 'grid'; root.appendChild(g); return g;
    }
    function cell(grid, name, w, h, draw, zoom) {
      zoom = zoom || 2;
      const c = document.createElement('canvas');
      c.width = w * zoom * 2; c.height = h * zoom * 2;
      c.style.width = w * zoom + 'px'; c.style.height = h * zoom + 'px';
      const g = c.getContext('2d');
      g.scale(zoom * 2, zoom * 2); g.lineJoin = 'round'; g.lineCap = 'round';
      draw(g);
      // keep a PNG copy (robust against GPU canvas eviction) and show it as an <img>
      const url = c.toDataURL('image/png');
      const img = new Image();
      img.src = url; img.style.width = w * zoom + 'px'; img.style.height = h * zoom + 'px'; img.style.display = 'block'; img.style.margin = '0 auto 4px';
      const d = document.createElement('div'); d.className = 'cell';
      d.appendChild(img); d.appendChild(document.createTextNode(name));
      grid.appendChild(d);
      c.width = c.height = 1;
      all.push({ name, url });
    }
    // Pikmin
    let g = section('Invaders — Pikmin (leaf / bud / flower × side / front / back)');
    for (const k of Object.keys(Art.PIK)) for (const tier of [0, 1, 2]) {
      cell(g, `${k} ${['leaf', 'bud', 'flower'][tier]}`, 96, 52, (x) => {
        ['side', 'front', 'back'].forEach((v, i) => { x.save(); x.translate(16 + i * 32, 48); Art.drawPikmin(x, k, tier, v, 0.1, 'walk'); x.restore(); });
      }, 2);
    }
    g = section('Invaders — walk cycle & attack (Red Pikmin)');
    cell(g, 'walk ×8', 8 * 30, 52, (x) => { for (let i = 0; i < 8; i++) { x.save(); x.translate(15 + i * 30, 48); Art.drawPikmin(x, 'red', 2, 'side', i / 8, 'walk'); x.restore(); } }, 2);
    cell(g, 'attack ×6', 6 * 30, 52, (x) => { for (let i = 0; i < 6; i++) { x.save(); x.translate(15 + i * 30, 48); Art.drawPikmin(x, 'red', 2, 'side', i / 6, 'attack'); x.restore(); } }, 2);
    cell(g, 'death spirit', 30, 40, (x) => { x.drawImage(Art.ghost('red').c, 0, 0, 30, 40); }, 2);
    g = section('Invaders — Captains');
    for (const k of Object.keys(Art.CAPT)) {
      const s = Art.CAPT[k].scale;
      cell(g, k, 130 * s, 70 * s, (x) => {
        ['side', 'front', 'back'].forEach((v, i) => { x.save(); x.translate((22 + i * 43) * s, 66 * s); Art.drawCaptain(x, k, v, 0.1, 'walk'); x.restore(); });
      }, 1.6);
    }
    g = section('Your creatures — towers');
    for (const k of Object.keys(Art.CRE)) {
      const C = Art.CRE[k];
      cell(g, k, C.w, C.h, (x) => { x.translate(C.ax, C.ay); C.draw(x, 0, 0, 1); }, 1.8);
      cell(g, k + ' (attack)', C.w, C.h, (x) => { x.translate(C.ax, C.ay); C.draw(x, 0, 0.55, 1); }, 1.8);
    }
    g = section('Your creatures — bulborb family, breadbug, snagret');
    for (const k of Object.keys(Art.BORB)) {
      const K = Art.BORB[k];
      cell(g, k, 90, 66, (x) => { x.translate(42, 62); x.scale(0.75 / K.scale * 0.9, 0.75 / K.scale * 0.9); Art.drawBulborb(x, K, 0, 0, false, 0); }, 1.6);
    }
    cell(g, 'emperor (tongue)', 130, 66, (x) => { x.translate(42, 62); x.scale(0.9, 0.9); Art.drawBulborb(x, Art.BORB.emperor, 0, 0.8, false, 1); }, 1.6);
    cell(g, 'breadbug', 70, 46, (x) => { x.translate(34, 42); Art.drawBreadbug(x, 0, false, 0, 1); }, 2);
    cell(g, 'burrowing snagret', 110, 100, (x) => { Art.drawSnagret(x, 40, 94, 1, 0.3, 1); }, 1.4);
    cell(g, 'wollywog (jump)', 70, 60, (x) => { x.translate(34, 54); Art.drawWollywog(x, 0, -0.6, 1, true); }, 1.6);
    g = section('Tower platforms & dens');
    for (const fam of ['groink', 'hog', 'cannon']) for (const t of [1, 2, 3, 4]) {
      cell(g, `${fam} tier ${t}`, 110, 100, (x) => { const s = Art.platform(fam, t); x.drawImage(s.c, 0, 0, s.w, s.h); }, 1.2);
    }
    for (const [t, e] of [[1, ''], [2, ''], [3, ''], [4, 'bulbear'], [4, 'breadbug']]) {
      cell(g, `den ${e || 'tier ' + t}`, 120, 110, (x) => { const s = Art.denBase(Math.min(3, t), e); x.drawImage(s.c, 0, 0, s.w, s.h); }, 1.2);
    }
    cell(g, 'build plot', 84, 56, (x) => { const s = Art.buildSpot(false); x.drawImage(s.c, 0, 0, s.w, s.h); }, 1.6);
    g = section('Props & landmarks');
    const P = Art.Props;
    const r = () => U.rng(4);
    const props = [
      ['bush', (x) => P.bush(x, 40, 56, 1.1, r(), '#4f9e3a', '#62b548')], ['rock', (x) => P.rock(x, 40, 56, 1.3, r(), '#a59f94')],
      ['clover', (x) => P.clover(x, 40, 56, 1.4, r())], ['daisy', (x) => P.daisy(x, 40, 56, 1.4, r(), '#fff')],
      ['mushroom', (x) => P.mushroom(x, 40, 56, 1.4, r(), '#e8483a', true)], ['glow mushroom', (x) => P.glowShroom(x, 40, 56, 1.3, r())],
      ['pellet posy', (x) => P.pelletPosy(x, 40, 60, 1.2, r())], ['bottle cap', (x) => P.bottleCap(x, 40, 50, 1.4)],
      ['soda can', (x) => P.can(x, 40, 50, 1)], ['battery', (x) => P.battery(x, 40, 50, 1.2)], ['fallen leaf', (x) => P.leaf(x, 40, 40, 1.6, r(), '#e4782b')],
      ['fern', (x) => P.fern(x, 40, 60, 1.3, r(), '#4f9a3a')], ['log', (x) => P.log(x, 40, 52, 1)], ['stump', (x) => P.stump(x, 40, 52, 1.3)],
      ['acorn', (x) => P.acorn(x, 40, 52, 1.6)], ['reeds', (x) => P.reeds(x, 40, 60, 1.2, r())], ['lilypad', (x) => P.lilypad(x, 40, 40, 2, U.rng(1))],
      ['onion', (x) => Art.drawOnion(x, 40, 64, 0.55, '#e8392c', 0.3)], ['burrow (exit)', (x) => Art.drawBurrow(x, 40, 50, 0.5, 'meadow')],
    ];
    for (const [n, f] of props) cell(g, n, 80, 66, f, 1.6);
    g = section('Icons');
    for (const n of ['heart', 'poko', 'wave', 'pause', 'play', 'speed1', 'speed2', 'sound', 'mute', 'upgrade', 'sell', 'rally', 'lock', 'star', 'starEmpty', 'check', 'sword', 'shield', 'range', 'clock', 'skull']) {
      cell(g, n, 40, 40, (x) => { const s = Art.icon(n, 32); x.drawImage(s.c, 4, 4, 32, 32); }, 1.6);
    }
    g = section('Maps');
    for (const lv of PTD.LEVELS) {
      cell(g, lv.name, 320, 180, (x) => { x.drawImage(Art.paintLevel(PTD.buildLevel(lv), 1), 0, 0, 320, 180); }, 1.2);
    }
    document.getElementById('dl').onclick = async () => {
      for (const a of all) {
        const link = document.createElement('a');
        link.download = 'bulborb-rush-' + a.name.replace(/[^a-z0-9]+/gi, '-').toLowerCase() + '.png';
        link.href = a.url;
        link.click();
        await new Promise((r) => setTimeout(r, 120));
      }
    };
  </script>
</body>
</html>
